name: Build and Deploy Frontend (Node)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Create .env.local
        run: echo "${{ secrets.ENV_FILE }}" > .env.local

      - name: Install Dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build Next.js Application
        run: npm run build

      - name: Prepare Standalone Release
        run: |
          # Copy static assets cleanly into standalone structure
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/public
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env.local
          # Tar standalone folder with dedicated filename
          tar -czf frontend-release.tar.gz -C .next/standalone .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend-release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to OCI VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Upload Tarball to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend-release.tar.gz"
          target: "~/tmp-deploy-frontend/"

      - name: Extract Release (Manual PM2 Reload)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            TARGET_DIR=~/invopilot-frontend
            TMP_DIR=~/tmp-deploy-frontend
            mkdir -p $TARGET_DIR
            mkdir -p $TMP_DIR
            
            # Extract standalone build directly over target (preserves old chunks for active user sessions)
            tar -xzf $TMP_DIR/frontend-release.tar.gz -C $TARGET_DIR
            rm -f $TMP_DIR/frontend-release.tar.gz
            
            echo "Frontend release successfully extracted to $TARGET_DIR."
            echo "Run: pm2 reload beta.invopilot.com || pm2 start node --name beta.invopilot.com -- $TARGET_DIR/server.js"
