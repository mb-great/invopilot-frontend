name: Build and Deploy Frontend (Node)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Create .env.local
        run: echo "${{ secrets.ENV_FILE }}" > .env.local

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Next.js Application
        run: npm run build

      - name: Prepare Standalone Release
        run: |
          # Copy static assets into standalone structure
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env.local
          # Tar standalone folder
          tar -czf frontend-release.tar.gz -C .next/standalone .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend-release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to OCI VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Upload Tarball to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend-release.tar.gz"
          target: "~/tmp-deploy-frontend/"

      - name: Extract Release (Clean Deploy)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            TARGET_DIR=~/invopilot-frontend
            TMP_DIR=~/tmp-deploy-frontend
            mkdir -p $TARGET_DIR

            # CRITICAL: Wipe old .next, node_modules, and server.js BEFORE extracting
            # This prevents stale chunks from previous builds causing ChunkLoadErrors
            rm -rf $TARGET_DIR/.next
            rm -rf $TARGET_DIR/node_modules
            rm -rf $TARGET_DIR/public
            rm -f  $TARGET_DIR/server.js
            rm -f  $TARGET_DIR/package.json
            rm -f  $TARGET_DIR/bun.lock $TARGET_DIR/bun.lockb

            # Extract fresh standalone build
            tar -xzf $TMP_DIR/frontend-release.tar.gz -C $TARGET_DIR
            rm -f $TMP_DIR/frontend-release.tar.gz

            echo "✅ Frontend extracted cleanly to $TARGET_DIR"
            echo "⚠️  Run: pm2 restart beta.invopilot.com"
