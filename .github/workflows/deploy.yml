name: Build and Deploy Frontend (Bun)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Create .env.local
        run: |
          cat << 'EOF' > .env.local
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install Dependencies
        run: bun install

      - name: Build Next.js Application
        run: bun run build

      - name: Tar Build Artifacts
        run: |
          tar -czf release.tar.gz \
            .next \
            public \
            package.json \
            next.config.ts \
            node_modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to OCI VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-release

      - name: Upload Tarball to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "release.tar.gz"
          target: "~/tmp-deploy/"

      - name: Extract Release (Manual PM2 Reload)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            TARGET_DIR=~/invopilot-frontend
            TMP_DIR=~/tmp-deploy
            mkdir -p $TARGET_DIR
            mkdir -p $TMP_DIR
            
            # Extract over existing directory
            tar -xzf $TMP_DIR/release.tar.gz -C $TARGET_DIR
            rm -f $TMP_DIR/release.tar.gz
            
            echo "Release successfully extracted to $TARGET_DIR."
            echo "Please SSH into the VPS and run 'pm2 reload beta.invopilot.com' manually."
