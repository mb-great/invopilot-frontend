name: Build and Deploy Frontend (Bun)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Create .env.local
        run: echo "${{ secrets.ENV_FILE }}" > .env.local

      - name: Install Dependencies
        run: bun install

      - name: Build Next.js Application
        run: bun run build

      - name: Prepare Standalone Release
        run: |
          # Copy static assets into standalone structure
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env.local
          # Tar only the standalone folder
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to OCI VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-release

      - name: Upload Tarball to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "release.tar.gz"
          target: "~/tmp-deploy/"

      - name: Extract Release (Manual PM2 Reload)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            TARGET_DIR=~/invopilot-frontend
            TMP_DIR=~/tmp-deploy
            mkdir -p $TMP_DIR
            
            # Clean previous build artifacts
            rm -rf $TARGET_DIR/.next $TARGET_DIR/public
            
            # Extract standalone build
            tar -xzf $TMP_DIR/release.tar.gz -C $TARGET_DIR
            rm -f $TMP_DIR/release.tar.gz
            
            echo "Release successfully extracted to $TARGET_DIR."
            echo "Run: pm2 reload beta.invopilot.com or pm2 start node --name beta.invopilot.com -- $TARGET_DIR/server.js"

